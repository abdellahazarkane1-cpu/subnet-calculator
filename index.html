<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Subnet Calculator — compute network, broadcast, and host ranges from an IPv4 address and CIDR prefix.">
  <title>Subnet Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-grid" aria-hidden="true"></div>

  <header class="header">
    <div class="header__inner">
      <div class="brand">
        <span class="brand__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
            <circle cx="7" cy="10" r="1" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="10" r="1" fill="currentColor" stroke="none"/>
            <circle cx="17" cy="10" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <h1 class="brand__title">Subnet Calculator</h1>
      </div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light theme">
        <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </span>
        <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="card calculator" aria-labelledby="calculator-heading">
      <div class="card__header">
        <h2 id="calculator-heading">IPv4 Subnet</h2>
        <p class="card__subtitle">Enter an address and CIDR prefix to compute network details.</p>
      </div>

      <form class="form" id="subnetForm" novalidate>
        <div class="form__row">
          <div class="field">
            <label class="field__label" for="ipAddress">IPv4 Address</label>
            <input
              class="field__input"
              type="text"
              id="ipAddress"
              name="ipAddress"
              placeholder="192.168.1.10"
              inputmode="decimal"
              autocomplete="off"
              spellcheck="false"
              required
            >
          </div>
          <div class="field field--cidr">
            <label class="field__label" for="cidr">CIDR</label>
            <div class="field__cidr-group">
              <span class="field__prefix" aria-hidden="true">/</span>
              <input
                class="field__input"
                type="number"
                id="cidr"
                name="cidr"
                placeholder="24"
                min="0"
                max="32"
                inputmode="numeric"
                required
              >
            </div>
          </div>
        </div>

        <p class="form__error" id="formError" role="alert" hidden></p>

        <button type="submit" class="btn btn--primary" id="calculateBtn">
          <span class="btn__text">Calculate</span>
          <span class="btn__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </span>
        </button>
      </form>
    </section>

    <section class="card results" id="resultsSection" aria-labelledby="results-heading" hidden>
      <div class="card__header">
        <h2 id="results-heading">Results</h2>
        <p class="card__subtitle" id="resultsSummary"></p>
      </div>

      <dl class="results__grid">
        <div class="result-item">
          <dt>Network Address</dt>
          <dd id="networkAddress">—</dd>
        </div>
        <div class="result-item">
          <dt>Broadcast Address</dt>
          <dd id="broadcastAddress">—</dd>
        </div>
        <div class="result-item">
          <dt>First Usable IP</dt>
          <dd id="firstUsable">—</dd>
        </div>
        <div class="result-item">
          <dt>Last Usable IP</dt>
          <dd id="lastUsable">—</dd>
        </div>
        <div class="result-item result-item--wide">
          <dt>Number of Hosts</dt>
          <dd id="hostCount">—</dd>
        </div>
      </dl>
    </section>
  </main>

  <footer class="footer">
    <p>Built with HTML, CSS &amp; JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
